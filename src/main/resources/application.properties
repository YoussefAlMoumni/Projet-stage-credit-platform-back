server.port=8081
spring.datasource.url=jdbc:postgresql://localhost:5432/credit_platform
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:53649713}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Ollama settings
ollama.api.url=http://localhost:11434/api/generate

# Resilience4j config for Ollama API
resilience4j.retry.instances.ollamaApi.maxAttempts=3
resilience4j.retry.instances.ollamaApi.waitDuration=2s
resilience4j.retry.instances.ollamaApi.enableExponentialBackoff=true
resilience4j.retry.instances.ollamaApi.exponentialBackoffMultiplier=2
resilience4j.retry.instances.ollamaApi.retryExceptions[0]=java.net.SocketTimeoutException
resilience4j.retry.instances.ollamaApi.retryExceptions[1]=java.io.IOException

resilience4j.circuitbreaker.instances.ollamaApi.failureRateThreshold=50
resilience4j.circuitbreaker.instances.ollamaApi.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.ollamaApi.slidingWindowSize=10
