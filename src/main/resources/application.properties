server.port=8081
spring.datasource.url=jdbc:postgresql://localhost:5432/credit_platform
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
logging.config=classpath:logback-spring.xml
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Ollama settings
ollama.api.url=http://localhost:11434/api/generate

# JWT configuration — set JWT_SECRET env var to a Base64-encoded 256-bit secret
# Generate one with: openssl rand -base64 32
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Seed user passwords — override these via environment variables in production
seed.admin.password=${SEED_ADMIN_PASSWORD:CHANGE_ME_admin_password}
seed.manager.password=${SEED_MANAGER_PASSWORD:CHANGE_ME_manager_password}
seed.banker.password=${SEED_BANKER_PASSWORD:CHANGE_ME_banker_password}
seed.analyst.password=${SEED_ANALYST_PASSWORD:CHANGE_ME_analyst_password}

# Resilience4j config for Ollama API
resilience4j.retry.instances.ollamaApi.maxAttempts=3
resilience4j.retry.instances.ollamaApi.waitDuration=2s
resilience4j.retry.instances.ollamaApi.enableExponentialBackoff=true
resilience4j.retry.instances.ollamaApi.exponentialBackoffMultiplier=2
resilience4j.retry.instances.ollamaApi.retryExceptions[0]=java.net.SocketTimeoutException
resilience4j.retry.instances.ollamaApi.retryExceptions[1]=java.io.IOException

resilience4j.circuitbreaker.instances.ollamaApi.failureRateThreshold=50
resilience4j.circuitbreaker.instances.ollamaApi.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.ollamaApi.slidingWindowSize=10
